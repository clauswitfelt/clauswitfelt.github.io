<script>

function beregnk()
{

  let kal2=antalsodavanner*135;
  
  document.getElementById("res").innerHTML=kal2;

  
 
  
}
  
  
</script>


<h1>Kalorieberegner</h1>

<button onclick="beregnk()">Beregn kalorie-forbrug</button>  
</form>
<p></p>
<h2>Antal kalorier</h2>
  
<div id="res">



</div>

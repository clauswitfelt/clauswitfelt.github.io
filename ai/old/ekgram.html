<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latin-detektiven</title>
  <style>
    :root {
      --blue: #2457a7;
      --light: #f2f6fc;
      --green: #176b3a;
      --red: #a52323;
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: var(--light);
      color: #172033;
    }

    h1 { color: var(--blue); }
    .intro, .activity, .result {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 2px 8px #00000012;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      background: var(--blue);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button:focus, select:focus { outline: 3px solid #f0b429; }
    .activity-button { text-align: left; min-height: 54px; }
    .secondary { background: #526174; }
    .options { display: grid; gap: 9px; margin-top: 14px; }
    .options button { background: #e8eef8; color: #172033; text-align: left; }
    .options button:hover { background: #d5e2f7; }
    .feedback { font-weight: 700; min-height: 1.5em; }
    .correct { color: var(--green); }
    .incorrect { color: var(--red); }
    .muted { color: #526174; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Latin-detektiven</h1>

  <section class="intro">
    <p>Vælg en aktivitet, og svar på spørgsmålet. Du får feedback med det samme.</p>
    <p><strong>Point:</strong> <span id="score">0</span> |
       <strong>Besvarede spørgsmål:</strong> <span id="answered">0</span></p>
  </section>

  <section class="activities" id="activityList" aria-label="Vælg aktivitet"></section>

  <section class="activity" id="game" hidden>
    <h2 id="activityTitle"></h2>
    <p id="question"></p>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <p id="explanation" class="muted"></p>
    <button id="nextButton" hidden>Næste spørgsmål</button>
    <button class="secondary" id="backButton">Tilbage til aktiviteter</button>
  </section>

  <script>
    const activities = [
      {
        title: "1. Verballeddet",
        question: "Hvilket ord er verballed i sætningen: “Femina amat”?",
        options: ["Femina", "amat", "Hele sætningen"],
        answer: 1,
        explanation: "Amat betyder “elsker” og er verballeddet (V)."
      },
      {
        title: "2. Verber og personer",
        question: "Hvad betyder “amas” ifølge bøjningsendelsen?",
        options: ["Jeg elsker", "Du elsker", "De elsker"],
        answer: 1,
        explanation: "Endelsen -s i amas viser “du” i eksemplerne i kompendiet."
      },
      {
        title: "3. Køn",
        question: "Hvilket køn har substantivet “femina”?",
        options: ["Hunkøn (femininum)", "Intetkøn (neutrum)", "Hankøn (maskulinum)"],
        answer: 0,
        explanation: "Femina er et hunkønsord."
      },
      {
        title: "4. Find subjektet",
        question: "Hvad er subjektet (S) i “Templum magnum est”?",
        options: ["Templum", "magnum", "est"],
        answer: 0,
        explanation: "Templum er subjektet. Magnum beskriver subjektet, og est er verballeddet."
      },
      {
        title: "5. Subjektsprædikat",
        question: "Hvilket ord er subjektsprædikat (SP) i “Marcus bellus est”?",
        options: ["Marcus", "bellus", "est"],
        answer: 1,
        explanation: "Bellus beskriver subjektet Marcus og er derfor SP."
      },
      {
        title: "6. Direkte objekt",
        question: "Hvad er det direkte objekt (DO) i “Marcus Victoriam amat”?",
        options: ["Marcus", "Victoriam", "amat"],
        answer: 1,
        explanation: "Victoriam er den, Marcus elsker. Endelsen -am viser akkusativ her."
      },
      {
        title: "7. Ordstilling",
        question: "Hvem elsker hvem i “Marcum Victoria amat”?",
        options: [
          "Marcus elsker Victoria",
          "Victoria elsker Marcus",
          "Marcus og Victoria elsker"
        ],
        answer: 1,
        explanation: "Marcum står i akkusativ og er DO. Victoria er subjektet."
      },
      {
        title: "8. Præposition og adverbielt led",
        question: "Hvilken præposition står i “Victoria in villa habitat”?",
        options: ["ad", "in", "per"],
        answer: 1,
        explanation: "In betyder her “i” og står foran villa."
      },
      {
        title: "9. Genitiv",
        question: "Hvad betyder “Villa Victoriae” i eksemplet i kompendiet?",
        options: ["Victorias villa", "Villaen til Victoria", "Victoria bor i en villa"],
        answer: 0,
        explanation: "Victoriae er genitiv og viser ejeforhold: Victorias villa."
      },
      {
        title: "10. Dativ og indirekte objekt",
        question: "Hvilket ord er indirekte objekt (IO) i “Marcus Victoriae basium dat”?",
        options: ["Marcus", "Victoriae", "basium"],
        answer: 1,
        explanation: "Victoriae er modtageren af kysset og fungerer som IO."
      },
      {
        title: "11. Aktiv eller passiv",
        question: "Er verbet passivt i “Victoria amatur”?",
        options: ["Ja", "Nej, det er aktivt"],
        answer: 0,
        explanation: "Endelsen -tur markerer passiv i eksemplet amatur."
      },
      {
        title: "12. Adverbium",
        question: "Hvad betyder “nunc” i “Victoria nunc Marcum amat”?",
        options: ["Nu", "Brændende", "I villaen"],
        answer: 0,
        explanation: "Nunc betyder “nu” og fungerer som adverbielt led."
      }
    ];

    const activityList = document.getElementById("activityList");
    const game = document.getElementById("game");
    const titleEl = document.getElementById("activityTitle");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const explanationEl = document.getElementById("explanation");
    const nextButton = document.getElementById("nextButton");
    let score = 0;
    let answered = 0;
    let current = null;

    activities.forEach((activity, index) => {
      const button = document.createElement("button");
      button.className = "activity-button";
      button.textContent = activity.title;
      button.addEventListener("click", () => startActivity(index));
      activityList.appendChild(button);
    });

    function startActivity(index) {
      current = activities[index];
      titleEl.textContent = current.title;
      questionEl.textContent = current.question;
      optionsEl.replaceChildren();
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      explanationEl.textContent = "";
      nextButton.hidden = true;
      game.hidden = false;
      activityList.hidden = true;

      current.options.forEach((option, optionIndex) => {
        const button = document.createElement("button");
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(optionIndex));
        optionsEl.appendChild(button);
      });
    }

    function checkAnswer(choice) {
      if (optionsEl.dataset.answered === "true") return;
      optionsEl.dataset.answered = "true";
      answered++;

      if (choice === current.answer) {
        score++;
        feedbackEl.textContent = "Rigtigt!";
        feedbackEl.classList.add("correct");
      } else {
        feedbackEl.textContent =
          "Ikke helt. Det rigtige svar er: " + current.options[current.answer];
        feedbackEl.classList.add("incorrect");
      }

      document.getElementById("score").textContent = score;
      document.getElementById("answered").textContent = answered;
      explanationEl.textContent = current.explanation;
      nextButton.hidden = false;
      optionsEl.querySelectorAll("button").forEach(button => {
        button.disabled = true;
      });
    }

    nextButton.addEventListener("click", () => {
      optionsEl.dataset.answered = "false";
      feedbackEl.textContent = "";
      explanationEl.textContent = "";
      nextButton.hidden = true;
      optionsEl.replaceChildren();

      current.options.forEach((option, optionIndex) => {
        const button = document.createElement("button");
        button.textContent = option;
        button.addEventListener("click", () => checkAnswer(optionIndex));
        optionsEl.appendChild(button);
      });
    });

    document.getElementById("backButton").addEventListener("click", () => {
      game.hidden = true;
      activityList.hidden = false;
      optionsEl.dataset.answered = "false";
    });
  </script>
</body>
</html>
